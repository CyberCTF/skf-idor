# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# OWASP SKF Insecure Direct Object References (OWASP Security Knowledge Framework labs, by Glenn ten Cate, Riccardo ten Cate and the SKF contributors) as an Isoloom spec:
# a Flask PDF store where any document is downloaded by guessing its numeric id (IDOR). The SKF lab folder python/IDOR is
# vendored unchanged in app/ and built by its own Dockerfile through an overlay
# (build/web/Dockerfile) that adds the flag folder /ctf.
# `isoloom generate`, then `isoloom run docker`.
version: 1
name: skf-idor

# Given by the CyberCTF launcher: this player's flag. Without it the development flag.
inputs: [CTF_FLAG_MAIN]

networks:
  lab: { cidr: 10.60.144.0/24, internet: false }

machines:
  web:
    networks: { lab: 10 }
    services: [{ port: 5000, name: web, http: true, publish: 5050 }]
    resources: { cpus: 1, memory_mb: 256 }
    inputs: [CTF_FLAG_MAIN]
    volumes: { ctf: /ctf }   # the flag, written by ctf/flag.sh at every start
    docker:
      build: app
      dockerfile: build/web/Dockerfile
      init: [ctf/flag.sh]

checks:
  - name: the lab answers
    http: http://web:5000/
    wait: 120
  - name: a PDF can be created and gets a numeric id
    script: checks/create.sh

message: |
  OWASP SKF Insecure Direct Object References answers at http://localhost:{{ machines.web.services.0.publish }}/.
  Create a PDF and look at its id. Download asks only for an id.
